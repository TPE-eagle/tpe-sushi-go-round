name: "🐤 API Canary — challenge probe"

# TEST ITERATION. Goal: prove whether a headless browser on a GitHub-hosted (US
# datacenter) runner can pass Taoyuan Airport's Cloudflare JS challenge and reach the
# flight API.
#
# Established so far (all verified today):
#   - curl → 403 "Just a moment" from every UA / IP / curl build tried.
#   - cf_clearance is IP-bound (a browser-earned cookie replayed from another IP → 403).
#   - a real browser on the SAME IP that solved the challenge → 200 + flight JSON.
# So the canary must solve the challenge with a real browser from its own IP. If this
# probe passes, the real hourly canary is a Playwright job right here — no Tailscale,
# no infra. If it fails, we escalate (stealth / headed browser).
on:
  pull_request:
    paths:
      - 'canary/**'
      - '.github/workflows/canary.yml'
  workflow_dispatch:

jobs:
  challenge-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Install deps"
        run: npm ci
      - name: "Install Playwright chromium"
        run: npx playwright install --with-deps chromium
      - name: "Probe: headless browser vs Cloudflare challenge (from this US runner)"
        run: node canary/challenge-probe.mjs
