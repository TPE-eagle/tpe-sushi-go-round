name: "🐤 API Canary"

# The Taoyuan flight API sits behind a Cloudflare managed challenge (verified 2026-07-08):
# curl / undici get 403 from any UA / IP, and the cf_clearance cookie is IP-bound. The
# probe is therefore a stealth Playwright browser that passes Cloudflare's bot check from
# its own runner IP — proven to work from a GitHub-hosted (US datacenter) runner. No
# Tailscale, no infra. See canary/probe.mjs.
on:
  schedule:
    - cron: '0 * * * *'          # hourly availability + contract check — ENQUEUED hourly;
                                 # GitHub delivers ~50% in practice (median +33 min late), #116.
                                 # Size samples by counting RUNS, never by multiplying hours.
  workflow_dispatch:              # manual run
    inputs:
      simulate:
        description: 'Force a failure to test the alert path (leave "none" for a real check)'
        type: choice
        options: [none, availability, contract]
        default: none
  pull_request:                   # PR: prove the stealth browser still clears Cloudflare
    paths:
      - 'canary/**'
      - '.github/workflows/canary.yml'

permissions:
  issues: write                   # incident-issue state machine (open/close) — the audit log

concurrency:
  group: api-canary               # never overlap runs
  cancel-in-progress: false

jobs:
  # PR only: reachability probe — no incident issues, no Discord. Catches a Cloudflare
  # tightening that breaks the stealth approach before it merges.
  challenge-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'        # aligned with ci.yml
          cache: 'npm'
      - run: npm ci
      - name: "Get Playwright version"
        id: pw-version
        run: echo "VERSION=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: "Cache Playwright browser"
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Deliberately NOT ci.yml's key (#81). Both jobs here install chromium only;
          # ci.yml installs every engine. One name for two payloads means whichever job
          # writes first once the key goes absent — a Playwright version bump, or a 7-day
          # eviction — decides what everyone else restores afterwards. The key has to encode
          # the content set, not just the version.
          #
          # Historical note: #81 filed this because a chromium-only blob under ci.yml's name
          # silently starved e2e-tests-production of webkit — its binary install was gated on
          # `cache-hit != 'true'` and nothing downstream re-checked. #92 removed that gate, so
          # that job now repairs itself. Treat it as a second line of defence, NOT a reason to
          # re-merge the keys: restoring a ~444 MiB (465 MB) four-engine blob to run one browser is
          # still wrong, and #81's rule stands without the starvation consequence.
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pw-version.outputs.VERSION }}
      - name: "Install Playwright chromium"
        uses: nick-fields/retry@v4   # rides out the flaky microsoft-packages apt mirror
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          # UNCONDITIONAL, on a cache hit as well as a miss (#92). The branch this replaced ran
          # `install-deps chromium` on a hit — system libraries only, never binaries — so a restored
          # payload missing the chromium binary would never be repaired, and the job would fail on a
          # missing browser with apt green in front of it.
          #
          # ⚠️ This is NOT a save-on-failure argument. actions/cache declares `post-if: success()`
          # (every release v1..v5), so a run that dies mid-install persists nothing. #92 was filed on
          # that wrong theory; the reason that survives is self-repair against a bad restore, which a
          # green run is enough to produce. Remoter here than in ci.yml — #82 gave these jobs their
          # own engine-scoped key — so treat this as simplification plus defence in depth.
          #
          # No extra cost over the branch it replaced: that already ran apt on every hit, and
          # `playwright install` downloads only what is absent, so on a complete warm cache the added
          # work is a registry check. `--with-deps` keeps the apt stage, which the cache never covers.
          command: npx playwright install --with-deps chromium
      - name: "Probe: stealth browser vs Cloudflare (from this US runner)"
        run: node canary/challenge-probe.mjs

  # Schedule / manual dispatch: full availability + contract check + incident state machine.
  canary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: "Get Playwright version"
        id: pw-version
        run: echo "VERSION=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: "Cache Playwright browser"
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Deliberately NOT ci.yml's key (#81). Both jobs here install chromium only;
          # ci.yml installs every engine. One name for two payloads means whichever job
          # writes first once the key goes absent — a Playwright version bump, or a 7-day
          # eviction — decides what everyone else restores afterwards. The key has to encode
          # the content set, not just the version.
          #
          # Historical note: #81 filed this because a chromium-only blob under ci.yml's name
          # silently starved e2e-tests-production of webkit — its binary install was gated on
          # `cache-hit != 'true'` and nothing downstream re-checked. #92 removed that gate, so
          # that job now repairs itself. Treat it as a second line of defence, NOT a reason to
          # re-merge the keys: restoring a ~444 MiB (465 MB) four-engine blob to run one browser is
          # still wrong, and #81's rule stands without the starvation consequence.
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pw-version.outputs.VERSION }}
      - name: "Install Playwright chromium"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          # UNCONDITIONAL, on a cache hit as well as a miss (#92). The branch this replaced ran
          # `install-deps chromium` on a hit — system libraries only, never binaries — so a restored
          # payload missing the chromium binary would never be repaired, and the job would fail on a
          # missing browser with apt green in front of it.
          #
          # ⚠️ This is NOT a save-on-failure argument. actions/cache declares `post-if: success()`
          # (every release v1..v5), so a run that dies mid-install persists nothing. #92 was filed on
          # that wrong theory; the reason that survives is self-repair against a bad restore, which a
          # green run is enough to produce. Remoter here than in ci.yml — #82 gave these jobs their
          # own engine-scoped key — so treat this as simplification plus defence in depth.
          #
          # No extra cost over the branch it replaced: that already ran apt on every hit, and
          # `playwright install` downloads only what is absent, so on a complete warm cache the added
          # work is a registry check. `--with-deps` keeps the apt stage, which the cache never covers.
          command: npx playwright install --with-deps chromium
      - name: "Run API canary"
        run: node canary/api-canary.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CANARY_WEBHOOK }}
          CANARY_SIMULATE: ${{ github.event.inputs.simulate }}
