name: "✈️ Flight Deck CI: Test & Deploy"

on:
  push:
    branches: [ main ]
    # Skip CI entirely for commits that only touch markdown. Saves ~6 minutes
    # of build + E2E per docs-only change. If a commit mixes markdown with
    # source changes, this filter is bypassed and the full pipeline runs.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

jobs:
  unit-tests:
    name: "🛫 Pre-flight Unit Tests"
    runs-on: ubuntu-latest
    steps:
    - name: "🔄 Flight Plan: Checkout Code"
      uses: actions/checkout@v6

    - name: "🛫 Pre-flight Checks"
      run: |
        echo "ATC Tower to Flight SGR: Pre-flight checks complete. Engines running. Ready for unit tests! ✈️"

    - name: "🔧 Ground Crew: Setup Node.js Environment"
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: "⛽ Refueling: Install Dependencies"
      run: npm ci

    - name: "🛫 Engines at Full Thrust: Run Unit Tests"
      run: npm run test:run

  e2e-tests-local:
    name: "🛫 Pre-flight E2E Tests (Local)"
    runs-on: ubuntu-latest
    needs: unit-tests
    # Blocking gate: a UAT that can't fail the build isn't a gate (PR #12 review).
    steps:
    - name: "🔄 Flight Plan: Checkout Code"
      uses: actions/checkout@v6

    - name: "🔧 Ground Crew: Setup Node.js Environment"
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: "⛽ Refueling: Install Dependencies"
      run: npm ci

    - name: "🔎 Get Playwright version"
      id: pw-version
      run: echo "VERSION=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: "🛫 Boarding Playwright Browsers"
      id: cache-playwright
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.VERSION }}

    # Split out of the single "Deploying Browser Engines" step (#36). The apt stage and the
    # browser download have very different cost profiles and used to share one 5-minute budget
    # sized for the fast path; each now gets its own.
    #
    # ⚠️ The budget is the real protection here, NOT max_attempts. When a nick-fields/retry
    # timeout fires it walks the process tree and calls process.kill on a process it does not
    # own, throwing `Error: kill EPERM`. That exception escapes the action, so the job hard-fails
    # on attempt 1 and the configured retries never happen — the wrapper that exists to absorb
    # the flake is what turns it into a red build, with the test step reported as *skipped*
    # rather than failed. Still unfixed upstream in v4, the version pinned below:
    # nick-fields/retry#124 (EPERM on timeout) and #114 (whole run fails without another
    # attempt) are both open; re-checked 2026-08-01. v4.0.0 is a node24 runtime bump and
    # nothing else, so it buys no reliability here. Keep these budgets generous, not tight.
    - name: "🔧 Ground Crew: Browser System Deps (apt)"
      # Runs on EVERY run, cache hit or not: the Playwright cache above only holds
      # ~/.cache/ms-playwright (the browsers), never system libraries. This is the step that
      # actually blew the old budget — on a slow-mirror day it is ~114 MB / 181 packages from
      # azure.archive.ubuntu.com, and one observed run was still at package 20 of 181 when the
      # 5 minutes ran out.
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 15
        max_attempts: 3
        retry_wait_seconds: 15
        command: npx playwright install-deps

    - name: "🛫 Deploying Browser Engines"
      # Browser download only (system deps handled above), and skipped entirely on a cache hit —
      # which is exactly why it should not share a budget with the apt stage.
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 15
        command: npx playwright install

    - name: "✈️ Execute Local E2E Flight Plan"
      id: e2e
      run: npm run test:e2e:local
      env:
        CI: true

    - name: "📥 Upload Local Flight Logs"
      uses: actions/upload-artifact@v7
      # Scoped to the test step, not the job. `failure()` alone is job-scoped,
      # so a job that dies before Playwright ever runs — `playwright install`
      # exhausting its retries (#59) — would trip the `error` guard below and
      # report "No files were found", which reads like a reporter regression
      # sitting above the real cause.
      if: failure() && steps.e2e.conclusion == 'failure'
      with:
        name: playwright-report-local
        path: playwright-report/
        # Default is `warn`, which uploaded nothing and still reported success
        # for months (#54): playwright-report/ only exists when the html
        # reporter is configured, and it was not. `error` makes that drift fail
        # loudly instead of silently. Given the `if:` above, this only runs when
        # the E2E step itself failed, so erroring here costs no signal.
        if-no-files-found: error
        retention-days: 7

  build-check:
    name: "✈️ Pre-flight Build Check (PR only)"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'   # main 上 deploy job 已含 build，不重複
    steps:
    - name: "🔄 Flight Plan: Checkout Code"
      uses: actions/checkout@v6
    - name: "🔧 Ground Crew: Setup Node.js Environment"
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
    - name: "⛽ Refueling: Install Dependencies"
      run: npm ci
    - name: "🚀 Build Aircraft Systems (verify compile before merge)"
      run: npm run build

  deploy:
    name: "🛬 Landing & Deployment"
    # Pages 一次只能一個部署 → 序列化避免 deployment_queued timeout + 重複 artifact 撞名
    # （job-level，不擋 PR 測試 job）。cancel-in-progress=false：不砍進行中的部署。
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: "🔄 Flight Plan: Checkout Code"
      uses: actions/checkout@v6

    - name: "🔧 Ground Crew: Setup Node.js Environment"
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: "⛽ Refueling: Install Dependencies"
      run: npm ci

    - name: "🚀 Build Aircraft Systems"
      run: npm run build

    - name: "🌐 Prepare Runway: Configure GitHub Pages"
      uses: actions/configure-pages@v6

    - name: "📦 Upload Aircraft Artifact"
      uses: actions/upload-pages-artifact@v5
      with:
        path: './dist'

    - name: "✈️ Deploying to GitHub Pages"
      id: deployment
      uses: actions/deploy-pages@v5

  e2e-tests-production:
    name: "🛬 Post-landing E2E Tests (Production)"
    runs-on: ubuntu-latest
    needs: deploy
    # Also run on PRs so changes to this suite (prod config / specs) are verified
    # pre-merge, not only post-merge. The prod config mocks the API via page.route and
    # points baseURL at the already-deployed live site, so it needs no fresh deploy — a
    # PR run exercises the current deployment. !cancelled() lets it run when the push-only
    # `deploy` dep is skipped on PRs. Caveat: a PR run tests the *current* deployment, so
    # it verifies test-harness changes; app-code regressions are gated by e2e-tests-local.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')) }}
    permissions:
      contents: read           # checkout
      pull-requests: write     # "Comment PR with Test Results" (github-script) posts to the PR — fixes the "Resource not accessible by integration" 403 (default token is read-only)
    steps:
    - name: "🔄 Flight Plan: Checkout Code"
      uses: actions/checkout@v6

    - name: "🔧 Ground Crew: Setup Node.js Environment"
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: "⛽ Refueling: Install Dependencies"
      run: npm ci

    - name: "🔎 Get Playwright version"
      id: pw-version
      run: echo "VERSION=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: "🛫 Boarding Playwright Browsers"
      id: cache-playwright
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.VERSION }}

    # Split out of the single "Deploying Browser Engines" step (#36). The apt stage and the
    # browser download have very different cost profiles and used to share one 5-minute budget
    # sized for the fast path; each now gets its own.
    #
    # ⚠️ The budget is the real protection here, NOT max_attempts. When a nick-fields/retry
    # timeout fires it walks the process tree and calls process.kill on a process it does not
    # own, throwing `Error: kill EPERM`. That exception escapes the action, so the job hard-fails
    # on attempt 1 and the configured retries never happen — the wrapper that exists to absorb
    # the flake is what turns it into a red build, with the test step reported as *skipped*
    # rather than failed. Still unfixed upstream in v4, the version pinned below:
    # nick-fields/retry#124 (EPERM on timeout) and #114 (whole run fails without another
    # attempt) are both open; re-checked 2026-08-01. v4.0.0 is a node24 runtime bump and
    # nothing else, so it buys no reliability here. Keep these budgets generous, not tight.
    - name: "🔧 Ground Crew: Browser System Deps (apt)"
      # Runs on EVERY run, cache hit or not: the Playwright cache above only holds
      # ~/.cache/ms-playwright (the browsers), never system libraries. This is the step that
      # actually blew the old budget — on a slow-mirror day it is ~114 MB / 181 packages from
      # azure.archive.ubuntu.com, and one observed run was still at package 20 of 181 when the
      # 5 minutes ran out.
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 15
        max_attempts: 3
        retry_wait_seconds: 15
        command: npx playwright install-deps

    - name: "🛫 Deploying Browser Engines"
      # Browser download only (system deps handled above), and skipped entirely on a cache hit —
      # which is exactly why it should not share a budget with the apt stage.
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 15
        command: npx playwright install

    - name: "🛫 Holding Pattern: Waiting for Deployment"
      if: github.event_name == 'push'   # only a fresh deploy needs propagation time; PR runs test the live site as-is
      run: sleep 30

    - name: "✈️ Execute Production E2E Flight Plan"
      run: npm run test:e2e:prod
      env:
        CI: true

    - name: "📥 Upload Production Flight Logs"
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report-production
        path: playwright-report/
        retention-days: 7

    - name: "📝 Flight Deck Report: Comment PR with Test Results"
      if: github.event_name == 'pull_request' && always()
      continue-on-error: true   # reporting-only nicety; needs pull-requests:write the default token lacks ("Resource not accessible by integration") — must not fail the gate. The real gate is the Execute step.
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let comment = '## ✈️ Flight Deck Test Report\n\n';
          
          try {
          // 🛩️ Gathering flight test data for report
            comment += '✅ Production E2E flight completed\n';
            comment += '📊 Check the [flight log report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details\n';
          } catch (error) {
            comment += '❌ Production E2E flight failed\n';
            comment += `Error: ${error.message}\n`;
          }

          // 📡 Dispatching flight report to PR
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });